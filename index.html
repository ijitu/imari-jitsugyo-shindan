<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>伊万里実業高校 学科診断</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP","Yu Gothic",sans-serif;background:#f5f7f4;color:#243026}
header{background:linear-gradient(135deg,#2f6b45,#7da66b);color:white;text-align:center;padding:48px 20px}
header h1{margin:0 0 12px;font-size:clamp(28px,6vw,46px)}
header p{margin:0;font-size:16px}
.container{max-width:850px;margin:30px auto;padding:0 18px}
.card{background:white;border-radius:18px;padding:26px;margin-bottom:18px;box-shadow:0 5px 20px #0000000d}
.question{font-size:18px;font-weight:700;margin:0 0 16px}
.options{display:grid;gap:10px}
.option{border:2px solid #e0e7df;border-radius:12px;padding:14px 16px;cursor:pointer;background:white;transition:.2s}
.option:hover{border-color:#6d9d72;background:#f4faf3}
.option input{margin-right:10px}
button{width:100%;border:0;border-radius:14px;padding:16px;font-size:18px;font-weight:700;cursor:pointer;background:#2f6b45;color:white}
button:hover{background:#255638}
.progress{height:8px;background:#dfe7df;border-radius:99px;overflow:hidden;margin:0 0 24px}
.progress-bar{height:100%;width:0;background:#6d9d72;transition:.3s}
.result{text-align:center;display:none}
.result .emoji{font-size:64px}
.result h2{font-size:30px;margin:8px 0}
.result .type{display:inline-block;padding:7px 14px;border-radius:99px;background:#edf5eb;margin:8px 0 20px;font-weight:700}
.result p{line-height:1.8}
.retry{margin-top:15px;background:#6b7280}
.note{font-size:13px;color:#667067;line-height:1.6}
</style>
</head>
<body>
<header>
  <h1>🏫 伊万里実業高校 学科診断</h1>
  <p>16問に答えて、あなたに合う「学科タイプ」をチェック！</p>
</header>

<main class="container">
  <div id="quiz">
    <div class="card">
      <div class="progress"><div class="progress-bar" id="progress"></div></div>
      <p class="note">各質問で、自分に近い方を選んでください。</p>
    </div>
    <div id="questions"></div>
    <p class="note">※この診断は学校案内用の「MBTI風」診断です。実際のMBTI検査ではありません。</p>
  </div>

  <div id="result" class="card result">
    <div class="emoji" id="resultEmoji"></div>
    <h2 id="resultTitle"></h2>
    <div class="type" id="resultType"></div>
    <p id="resultText"></p>
    <button class="retry" onclick="location.reload()">もう一度診断する</button>
  </div>
</main>

<script>
const questions = [
["初めて会った人が多い場所では？","自分から話しかける","まず周りの様子を見る","E","I"],
["友達と遊んだ後は？","みんなと過ごして元気になる","一人の時間を過ごしたくなる","E","I"],
["グループ活動では？","積極的に意見を出す","考えてから意見を出す","E","I"],
["分からないことがあったら？","すぐ誰かに聞いてみる","まず自分で調べてみる","E","I"],
["新しいことを覚えるなら？","実際にやってみたい","仕組みや理由を知りたい","S","N"],
["説明を聞くとき、気になるのは？","具体的な方法や手順","全体の考え方や可能性","S","N"],
["何かを作るときは？","見本を参考にして作る","自分なりのアイデアを加える","S","N"],
["将来について考えるときは？","現実的にできることを考える","自分がやってみたいことを想像する","S","N"],
["友達と意見が合わないときは？","どちらが正しいかを考える","相手の気持ちを考える","T","F"],
["何かを決めるときに重視するのは？","理由や結果","人の気持ちや納得感","T","F"],
["誰かにアドバイスするとしたら？","問題を解決する方法を伝える","まず相手の話を聞く","T","F"],
["チームで何かをするとき、大切なのは？","効率よく成果を出すこと","みんなが楽しく協力できること","T","F"],
["テスト勉強をするときは？","勉強する予定を決める","その日の気分で決める","J","P"],
["遠足や旅行に行くなら？","事前に予定を立てたい","その場で行きたい場所を決めたい","J","P"],
["課題をするときは？","早めに終わらせておきたい","締め切りまでに自分のペースでやりたい","J","P"],
["予定が急に変わったら？","ちょっと困るので、計画を立て直したい","その場に合わせて楽しみたい","J","P"]
];

const departments = {
  ISFJ:["🌱","生物科学科","自然や生き物に関心を持ち、丁寧に取り組むことが好きなあなたにおすすめの学科タイプです。"],
  INFJ:["🌱","生物科学科","物事を深く考えながら、自然や生き物について学ぶことに興味を持ちやすい学科タイプです。"],
  ISTJ:["🌲","森林環境科","計画的に物事へ取り組み、具体的な作業を着実に進めることが好きなあなたにおすすめの学科タイプです。"],
  ISTP:["🌲","森林環境科","実際に手を動かしながら、自然や環境について学ぶことを楽しみやすい学科タイプです。"],
  ESTP:["🌲","森林環境科","行動力を活かして、実際の環境や自然に触れながら学ぶことを楽しみやすい学科タイプです。"],
  ISFP:["🍳","フードビジネス科","感性を活かし、実際に作ったり工夫したりすることを楽しみやすい学科タイプです。"],
  INFP:["🍳","フードビジネス科","自分らしいアイデアや感性を活かして取り組むことが好きなあなたにおすすめの学科タイプです。"],
  ESFP:["🍳","フードビジネス科","人と関わりながら、楽しく実践的に取り組むことを楽しみやすい学科タイプです。"],
  ENFP:["🍳","フードビジネス科","新しいアイデアを考えたり、人と関わったりすることを楽しみやすい学科タイプです。"],
  ESTJ:["💼","商業科","目標を決めて行動し、効率よく成果を出すことが好きなあなたにおすすめの学科タイプです。"],
  ESFJ:["💼","商業科","人との協力を大切にしながら、実践的に取り組むことを楽しみやすい学科タイプです。"],
  ENFJ:["💼","商業科","人と協力して目標を達成することや、周囲をまとめることを楽しみやすい学科タイプです。"],
  ENTJ:["💼","商業科","目標に向かって計画的に行動し、成果につなげることを楽しみやすい学科タイプです。"],
  INTJ:["💻","情報処理科","仕組みを考えたり、論理的に問題を解決したりすることが好きなあなたにおすすめの学科タイプです。"],
  INTP:["💻","情報処理科","物事の仕組みを深く考え、論理的に試行錯誤することを楽しみやすい学科タイプです。"],
  ENTP:["💻","情報処理科","新しいアイデアを考え、工夫しながら問題を解決することを楽しみやすい学科タイプです。"]
};

const qbox=document.getElementById("questions");
let currentQuestion=0;
const selectedAnswers=Array(16).fill(null);

function renderQuestion(){
  const q=questions[currentQuestion];
  qbox.innerHTML = `<div class="card">
    <p class="question">Q${currentQuestion+1}. ${q[0]}</p>
    <div class="options">
      <label class="option"><input type="radio" name="current" value="${q[3]}">A：${q[1]}</label>
      <label class="option"><input type="radio" name="current" value="${q[4]}">B：${q[2]}</label>
    </div>
  </div>
  <button id="nextBtn">${currentQuestion === 15 ? "診断結果を見る" : "次の質問へ →"}</button>`;

  if(selectedAnswers[currentQuestion]){
    const radio=document.querySelector(`input[name="current"][value="${selectedAnswers[currentQuestion]}"]`);
    if(radio) radio.checked=true;
  }

  document.getElementById("progress").style.width=((currentQuestion+1)/16*100)+"%";

  document.querySelectorAll('input[name="current"]').forEach(el=>{
    el.addEventListener("change",()=>{
      selectedAnswers[currentQuestion]=el.value;
      setTimeout(()=>{
        if(currentQuestion < 15){
          currentQuestion++;
          renderQuestion();
          window.scrollTo({top:0,behavior:"smooth"});
        }else{
          showResult();
        }
      },180);
    });
  });

  document.getElementById("nextBtn").addEventListener("click",()=>{
    const checked=document.querySelector('input[name="current"]:checked');
    if(!checked){
      alert("AかBを選択してください。");
      return;
    }
    selectedAnswers[currentQuestion]=checked.value;
    if(currentQuestion < 15){
      currentQuestion++;
      renderQuestion();
      window.scrollTo({top:0,behavior:"smooth"});
    }else{
      showResult();
    }
  });
}

function showResult(){
  const counts={E:0,I:0,S:0,N:0,T:0,F:0,J:0,P:0};
  selectedAnswers.forEach(x=>counts[x]++);
  const type =
    (counts.E>=counts.I?"E":"I")+
    (counts.S>=counts.N?"S":"N")+
    (counts.T>=counts.F?"T":"F")+
    (counts.J>=counts.P?"J":"P");

  const d=departments[type];
  document.getElementById("quiz").style.display="none";
  document.getElementById("result").style.display="block";
  document.getElementById("resultEmoji").textContent=d[0];
  document.getElementById("resultTitle").textContent=`あなたは「${d[1]}タイプ！」`;
  document.getElementById("resultType").textContent=`MBTI風タイプ：${type}`;
  document.getElementById("resultText").textContent=d[2];
  window.scrollTo({top:0,behavior:"smooth"});
}

renderQuestion();
</script>
</body>
</html>
